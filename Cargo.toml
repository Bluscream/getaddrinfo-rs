[package]
name = "getaddrinfo-rs"
version = "0.1.0"
edition = "2024"
authors = ["Bluscream <bluscream@users.noreply.github.com>"]
description = "A powerful, drop-in getaddrinfo interceptor and extended HOSTS resolver supporting wildcards, redirects, Wine prefixes, and hosts.d modular directories."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Bluscream/getaddrinfo-rs"

[lib]
name = "getaddrinfo"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "getaddrinfo-rs"
path = "src/main.rs"

[dependencies]
glob-match = "0.2.1"
libc = "0.2"

[lints.clippy]
all = { level = "warn", priority = -1 }
correctness = { level = "deny", priority = -1 }
suspicious = { level = "warn", priority = -1 }
complexity = { level = "warn", priority = -1 }
perf = { level = "warn", priority = -1 }
style = { level = "warn", priority = -1 }
too_many_lines = "warn"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
